<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src http://127.0.0.1:* ws://127.0.0.1:*">
<meta name="color-scheme" content="light dark">
<title>Lantern Quick Ask</title>
<link rel="stylesheet" href="quick.css">
</head>
<body>
  <div class="quick" role="dialog" aria-label="Ask Lantern">
    <form id="q-form" class="q-field" autocomplete="off">
      <span class="q-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M9.8 4.7a2.2 2.2 0 0 1 4.4 0"/><path d="M8.2 6.6h7.6M9.2 20.4h5.6"/><rect x="6.8" y="6.6" width="10.4" height="13.8" rx="4.4"/><path d="M12 10.2c1.4 1.4 1.9 2.5 1.9 3.5a1.9 1.9 0 0 1-3.8 0c0-1 .5-2.1 1.9-3.5z"/></svg>
      </span>
      <input id="q" placeholder="Ask Lantern…" maxlength="2000" role="combobox" aria-controls="q-rows" aria-expanded="true" aria-autocomplete="list" spellcheck="false">
      <kbd>esc</kbd>
    </form>
    <ul id="q-rows" class="q-rows" role="listbox" aria-label="Suggestions"></ul>
    <div class="q-foot"><span id="q-status" role="status"></span><span class="keys">↑ ↓ choose · ↩ run · esc close</span></div>
  </div>
  <script src="lib/state.js"></script>
  <script src="lib/today.js"></script>
  <script src="lib/quick.js"></script>
  <script src="lib/api.js"></script>
  <script src="quick.js"></script>
</body>
</html>
