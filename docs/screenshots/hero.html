<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lantern hero</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 1600px; height: 900px; overflow: hidden; position: relative;
         font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", Inter, system-ui, sans-serif;
         background: radial-gradient(900px 600px at 15% 10%, #ffd9a0 0%, transparent 60%),
                     radial-gradient(800px 700px at 95% 90%, #c9b8ff 0%, transparent 60%),
                     linear-gradient(135deg, #fff4e6 0%, #f3eefe 100%); -webkit-font-smoothing: antialiased; color: #111; }
  .copy { position: absolute; left: 80px; top: 120px; width: 500px; }
  .icon { width: 84px; height: 84px; border-radius: 20px; display: grid; place-items: center; background: linear-gradient(160deg, #ffc65c, #ff8a1f);
          box-shadow: 0 10px 28px rgba(255, 138, 31, .4); margin-bottom: 26px; }
  .icon svg { width: 52px; height: 52px; fill: none; stroke: #fff; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  h1 { margin: 0 0 14px; font-size: 72px; letter-spacing: -.035em; line-height: 1; }
  p { margin: 0 0 30px; font-size: 25px; line-height: 1.35; color: #4a4a52; }
  .chips { display: flex; flex-direction: column; gap: 12px; }
  .chip { align-self: flex-start; background: rgba(255, 255, 255, .85); border-radius: 99px; padding: 11px 18px; font-size: 19px; font-weight: 600;
          box-shadow: 0 1px 2px rgba(0, 0, 0, .05), 0 6px 18px rgba(0, 0, 0, .06); }
  .chip b { color: #ff8a1f; margin-right: 8px; }
  .shot { position: absolute; border-radius: 12px; box-shadow: 0 30px 80px rgba(40, 20, 80, .28), 0 0 0 1px rgba(0, 0, 0, .08); }
  .panel { left: 610px; top: 60px; width: 900px; }
  .dark { left: 540px; top: 545px; width: 450px; }
  .island { position: absolute; right: 30px; bottom: -30px; width: 280px; filter: drop-shadow(0 20px 40px rgba(0, 0, 0, .25)); }
</style>
</head>
<body>
  <div class="copy">
    <div class="icon"><svg viewBox="0 0 24 24"><path d="M9.8 4.7a2.2 2.2 0 0 1 4.4 0"/><path d="M8.2 6.6h7.6M9.2 20.4h5.6"/><rect x="6.8" y="6.6" width="10.4" height="13.8" rx="4.4"/><path d="M12 10.2c1.4 1.4 1.9 2.5 1.9 3.5a1.9 1.9 0 0 1-3.8 0c0-1 .5-2.1 1.9-3.5z"/></svg></div>
    <h1>Lantern</h1>
    <p>The AI that lives on your laptop, does the boring computer work, and asks before anything changes.</p>
    <div class="chips">
      <span class="chip"><b>●</b>Fills forms, sends email, tidies files</span>
      <span class="chip"><b>●</b>Every change approved, then verified</span>
      <span class="chip"><b>●</b>Private files never leave the laptop</span>
    </div>
  </div>
  <img class="shot dark" src="today-dark.png" alt="">
  <img class="shot panel" src="approval-sheet.png" alt="">
  <img class="island" src="island-done-cut.png" alt="">
</body>
</html>
